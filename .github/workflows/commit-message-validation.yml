name: commit message validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  validate:
    name: commit message validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate commit messages
        uses: actions/github-script@v7
        with:
          script: |
            const isTrailerLine = (line) => /^[A-Za-z-]+:\s+.+$/.test(line);
            const isCoAuthoredBy = (line) => /^Co-authored-by:\s+.+$/i.test(line);
            const nonImperativeStarters = new Set([
              'initial',
              'misc',
              'planning',
              'plan',
            ]);

            const validateCommitMessage = (message) => {
              const errors = [];
              if (!message || message.trim() === '') {
                return ['Commit message is empty.'];
              }

              const normalized = message.replace(/\r\n/g, '\n');
              const lines = normalized.split('\n');
              const subject = lines[0] || '';

              if (subject.trim() === '') {
                errors.push('Subject line is empty.');
              }

              if (subject.length > 70) {
                errors.push(`Subject exceeds 70 characters (${subject.length}).`);
              }

              if (!/^\p{Lu}/u.test(subject)) {
                errors.push('Subject must start with a capital letter.');
              }

              // Imperative heuristic:
              // - first word must begin with a capital letter
              // - first word must not be a known non-imperative starter
              // - first word must not look like a gerund (ends in "ing")
              const firstWord = (subject.match(/^([^\s]+)/) || [])[1] || '';
              const normalizedFirstWord = firstWord.replace(/^[^\p{L}]+|[^\p{L}]+$/gu, '');
              const lowerFirstWord = normalizedFirstWord.toLowerCase();
              if (
                /^\p{Lu}/u.test(subject) &&
                (
                  normalizedFirstWord === '' ||
                  nonImperativeStarters.has(lowerFirstWord) ||
                  /ing$/i.test(lowerFirstWord)
                )
              ) {
                errors.push('Subject must begin with an imperative verb (heuristic rejects starters like Initial/Planning/Misc and words ending in "ing").');
              }

              if (/\.$/.test(subject)) {
                errors.push('Subject must not end with a period.');
              }

              if (/^\[[^\]]+\]:\s*/.test(subject) || /^[A-Za-z]+(?:\([^)]+\))?!?:\s+/.test(subject)) {
                errors.push('Subject must not use prefix conventions like [agent]:, [chore]:, feat:, fix:.');
              }

              if (lines.length > 1 && lines[1] !== '') {
                errors.push('Body must be separated from subject by one blank line.');
              }

              const contentStart = 2;
              let firstTrailerIndex = -1;
              for (let i = contentStart; i < lines.length; i += 1) {
                if (isTrailerLine(lines[i])) {
                  firstTrailerIndex = i;
                  break;
                }
              }

              const bodyEnd = firstTrailerIndex === -1 ? lines.length : firstTrailerIndex;

              for (let i = contentStart; i < bodyEnd; i += 1) {
                const line = lines[i];
                if (line.length > 70) {
                  errors.push(`Body line ${i + 1} exceeds 70 characters (${line.length}).`);
                }
              }

              if (firstTrailerIndex !== -1) {
                if (firstTrailerIndex > contentStart && lines[firstTrailerIndex - 1] !== '') {
                  errors.push('Trailer block must be separated from body by a blank line.');
                }

                for (let i = firstTrailerIndex; i < lines.length; i += 1) {
                  const line = lines[i];
                  if (line.trim() === '') {
                    continue;
                  }

                  if (!isTrailerLine(line)) {
                    errors.push('Trailers must appear at the end of the commit message.');
                    continue;
                  }

                  if (!isCoAuthoredBy(line)) {
                    errors.push(`Unsupported trailer "${line.split(':')[0]}:". Only Co-authored-by is allowed.`);
                  }
                }
              }

              return errors;
            };

            const runSelfTests = () => {
              const cases = [
                {
                  name: 'valid simple subject',
                  message: 'Add commit message validation workflow',
                  expectValid: true,
                },
                {
                  name: 'valid copilot trailer without body',
                  message: 'Add workflow checks\n\nCo-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>',
                  expectValid: true,
                },
                {
                  name: 'invalid lowercase subject',
                  message: 'add workflow checks',
                  expectValid: false,
                },
                {
                  name: 'invalid non-imperative initial',
                  message: 'Initial plan',
                  expectValid: false,
                },
                {
                  name: 'invalid non-imperative planning',
                  message: 'Planning updates',
                  expectValid: false,
                },
                {
                  name: 'invalid non-imperative misc',
                  message: 'Misc fixes',
                  expectValid: false,
                },
                {
                  name: 'invalid conventional prefix',
                  message: 'feat: add workflow checks',
                  expectValid: false,
                },
                {
                  name: 'invalid missing body separator',
                  message: 'Add workflow checks\nBody line without blank separator',
                  expectValid: false,
                },
                {
                  name: 'invalid body wrap',
                  message: 'Add workflow checks\n\nThis body line is intentionally made longer than seventy characters to fail wrapping.',
                  expectValid: false,
                },
                {
                  name: 'invalid trailer placement',
                  message: 'Add workflow checks\n\nCo-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>\nBody after trailer',
                  expectValid: false,
                },
                {
                  name: 'valid unicode and backticks',
                  message: 'Add `über` support for records',
                  expectValid: true,
                },
              ];

              const failures = [];
              for (const testCase of cases) {
                const actualValid = validateCommitMessage(testCase.message).length === 0;
                if (actualValid !== testCase.expectValid) {
                  failures.push(`${testCase.name} (expected ${testCase.expectValid}, got ${actualValid})`);
                }
              }

              if (failures.length > 0) {
                throw new Error('Validator self-tests failed: ' + failures.join('; '));
              }
            };

            runSelfTests();

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commitsToValidate = [];

            if (context.eventName === 'pull_request') {
              const pullNumber = context.payload.pull_request.number;
              let page = 1;
              // Always validate the full PR commit history via API pagination.
              while (true) {
                const response = await github.rest.pulls.listCommits({
                  owner,
                  repo,
                  pull_number: pullNumber,
                  per_page: 100,
                  page,
                });

                commitsToValidate.push(...response.data.map((commit) => ({
                  sha: commit.sha,
                  message: commit.commit.message || '',
                  isMerge: (commit.parents || []).length > 1 || /^Merge\b/.test((commit.commit.message || '').split(/\r?\n/, 1)[0] || ''),
                })));

                if (response.data.length < 100) {
                  break;
                }
                page += 1;
              }
            } else if (context.eventName === 'push') {
              commitsToValidate.push(...(context.payload.commits || []).map((commit) => ({
                sha: commit.id,
                message: commit.message || '',
                isMerge: /^Merge\b/.test((commit.message || '').split(/\r?\n/, 1)[0] || ''),
              })));
            }

            const violations = [];

            for (const commit of commitsToValidate) {
              if (commit.isMerge) {
                continue;
              }

              const errors = validateCommitMessage(commit.message);
              if (errors.length > 0) {
                violations.push({
                  sha: (commit.sha || '').slice(0, 7),
                  errors,
                });
              }
            }

            if (violations.length > 0) {
              const details = violations
                .map((violation) => `- ${violation.sha}: ${violation.errors.join(' | ')}`)
                .join('\n');
              core.setFailed(`Commit message validation failed:\n${details}`);
              return;
            }

            core.info(`Validated ${commitsToValidate.length} commit(s); no violations found.`);
